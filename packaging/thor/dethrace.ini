; A starting config for the AYN Thor (Adreno 740, 1080p): the desktop look with the costliest parts
; cut down. Measure on the device and tune from there (see docs/CONFIGURATION.md):
; - the shadow maps 2048x2048 (48MB instead of 768MB of shared memory), MSAA 2x, no supersampling
; - no SSAO, car reflections or heat shimmer; texture upscaling off; a shorter draw distance
; Set the game paths in [Games] to your own copy of the game's files.
[General]
; --- game setup
DefaultGame = c1
CdCheck = 0
GoreCheck = 0
BoringMode = 0
Cutscenes = 0
Windowed = 0
Hires = 1
HiresSoftware = 1
PhysicsPerFrame = 0
FPSLimit = 0
VSync = 1
CameraSmoothing = 0.08
CameraKick = 1

; --- OpenGL renderer, widescreen
Emulate3DFX = 1
Widescreen = 1
WidescreenHud = 1

; --- image quality
TextureFiltering = sharp
TextureUpscaler = none
MSAA = 2
Supersampling = 0

; --- draw distance, fog
DrawDistance = 2
DrawEverything = 1
MaxDetail = 1
DistanceFog = 1
DistanceFade = 0

; --- lights and night
Glow = 1
GlowStrength = 0.7
LensFlare = 0
Night = auto
NightBrightness = 0.3
HeadlightStrength = 2
HeadlightHaze = 1
PedestrianShadows = 1
SurfaceVariation = 1
SunShading = 1
SunShadows = 1
ShadowMapSize = 2048
SunHighlights = 1
Relief = 0
Haze = 1
Flashes = 1
WetRoads = 1
IceReflections = 1
WaterReflections = 1
SoftParticles = 1
CarReflections = 0
RoundWheels = 1
CarWear = 1
Weather = 1

; --- post-processing
DepthOfField = 0
DepthOfFieldStart = 0.5
DepthOfFieldStrength = 2
SSAO = 0
SSAOStrength = 1
SpeedBlur = 0
HeatShimmer = 0
ColourGrading = 1

[Games]
c1 = /path/to/your/CARMA
sp = /path/to/your/CARSPLAT

[Sound]
Enabled = 1
SoundOptionsScreen = 1
VolumeMultiplier = 1
